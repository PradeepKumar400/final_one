spring.application.name=Complaint-Management

# ==========================
# MySQL Database Connection
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pradeep
server.port=8081

# ==========================
# JPA / Hibernate Settings
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR

# ==========================
# JWT Configuration
# ==========================
# Secret must be >= 256 bits (32+ chars) for HMAC-SHA256
jwt.secret=SmartPanchayatComplaintMgmt2024SecureKey!ChangeInProd

# ==========================
# SLA Deadlines (hours)
# ==========================
app.complaint.sla.urgent-hours=24
app.complaint.sla.normal-hours=72
app.complaint.sla.low-hours=168

# ==========================
# Cloudinary Configuration (Optional - will use local storage if blank/demo)
# ==========================
cloudinary.cloud-name=demo
cloudinary.api-key=123456789012345
cloudinary.api-secret=demo_secret_key

# ==========================
# Local Storage Configuration
# ==========================
app.upload.dir=./uploads/complaints

# ==========================
# Twilio SMS (optional)
# ==========================
# twilio.account-sid=YOUR_SID
# twilio.auth-token=YOUR_TOKEN
# twilio.from-number=+1XXXXXXXXXX

# ==========================
# Multipart / File Upload Settings
# ==========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
